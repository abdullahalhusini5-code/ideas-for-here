name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the two dev-only checkers
        run: npm ci

      - name: Catalog, schema, MCP and server
        run: node tools/test-mcp.mjs

      - name: Catalog matches ideas.schema.json
        run: node tools/check-schema.mjs

      - name: Documented counts and dependency policy
        run: node tools/check-repo.mjs

      - name: Pages are valid HTML
        run: npm run check:html
